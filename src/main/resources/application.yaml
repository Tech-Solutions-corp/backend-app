spring:
  application:
    name: application
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  jpa:
    hibernate:
      # Para desenvolvimento local podemos permitir que o Hibernate atualize o esquema
      # Isso evita falhas de validação quando as migrations não foram aplicadas.
      # NÃO recomendado para produção — em produção use 'validate' e execute as migrations com Flyway.
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQLDialect
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/techsolution_app_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=America/Sao_Paulo&connectionCollation=utf8mb4_unicode_ci}
    username: ${DB_USERNAME:financial_db_user}
    password: ${DB_PASSWORD:financial_db_password}
  # Em ambiente de desenvolvimento local desabilitamos o Flyway para evitar conflitos
  # com o comportamento de atualização automática do Hibernate. Habilite Flyway
  # em produção e aplique as migrations manualmente (ou com CI).
  flyway:
    enabled: false
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.5
springdoc:
  api-docs:
    enabled: true
application:
  var:
    token:
      secret: dev-local-jwt-secret-minimum-32-bytes-keep-safe-2026
      expiration-time: ${JWT_EXPIRATION:7200000}
      password-reset-expiration-time: ${JWT_PASSWORD_RESET_EXPIRATION:900000}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
    frontend:
      reset-password-url: ${FRONTEND_RESET_PASSWORD_URL:http://localhost:8081/redefinir-senha}
    mail:
      from: ${MAIL_FROM:no-reply@financeiro-app.local}
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:financial-minio-user}
  secret-key: ${MINIO_SECRET_KEY:financial-minio-password}
  bucket: ${MINIO_BUCKET:financial-imports-bucket}